# BioImaging News — scraper configuration (biophotonic imaging)
# Same pipeline as FemtoNews (adapted from VibraNews by ForestBin-Raman). Edit this file to change what the crawl looks for.

site:
  name: BioImaging News
  url: https://linshulang12-u.github.io/BioImagingNews/   # used in the bot User-Agent

http:
  user_agent: "BioImagingNewsBot/1.0 (+{site_url}; weekly literature digest)"
  timeout_s: 20
  delay_s: 1.0
  api_delay_s: 0.2
  respect_robots_txt: true

sources:
  europepmc: true
  openalex: true
  crossref: true
  arxiv: true
  max_results_per_query: 400
  max_europepmc: 6000
  max_crossref_rows: 1000
  max_openalex_per_term: 6000

# A paper is kept if its TITLE matches any include pattern, or its ABSTRACT matches one at least twice.
include:
  - '(two|three|multi)-?photon (microscop\w*|imaging|excitation microscop\w*|fluorescence (imaging|microscop\w*)|endoscop\w*|calcium|voltage|population imaging|ultra-?deep)|\b(2PEF|3PEF|MPM)\b'
  - '(second|third)[- ]harmonic generation (microscop\w*|imaging)|\b(SHG|THG) (microscop\w*|imaging)'
  - 'light[- ]sheet|\bLSFM\b|\bSPIM\b|oblique plane microscop|lattice light|selective plane illumination'
  - 'super-?resolution (microscop\w*|imaging|fluorescence|optical)|nanoscop\w*|\bSTED\b|\bRESOLFT\b|\bSMLM\b|\bMINFLUX\b|\bMINSTED\b|structured illumination microscop|expansion microscop|single-molecule localization|localization microscop|\bSOFISM?\b'
  - 'confocal (microscop\w*|imaging|endomicroscop\w*|laser scanning)|fluorescence (microscop\w*|imaging|lifetime imaging|endoscop\w*|tomograph\w*|guided surgery)|\bFLIM\b|wide-?field fluorescence|epi-?fluorescence'
  - 'optical coherence (tomograph\w*|microscop\w*|elastograph\w*)|\bOCT\b|\bOCTA\b|\bOCM\b|swept-source'
  - 'photo-?acoustic (imaging|tomograph\w*|microscop\w*|endoscop\w*|arthroscop\w*|molecular imaging)|opto-?acoustic (imaging|tomograph\w*)|\bMSOT\b|\bRSOM\b'
  - '(stimulated|coherent) Raman (scattering )?(microscop\w*|imaging|histolog\w*|spectromicroscop\w*)|\b(SRS|CARS) (microscop\w*|imaging)|Raman (imaging|microscop\w*|histolog\w*)|stimulated Raman histolog|vibrational (imaging|microscop\w*)|photothermal (microscop\w*|imaging|optical diffraction)|mid-?infrared photothermal'
  - 'quantitative phase (imaging|microscop\w*)|\bQPI\b|digital holographic microscop|optical diffraction tomograph|label-free (imaging|microscop\w*|optical|histolog\w*)|oblique back-?illumination|scattering microscop'
  - 'diffuse (optical|correlation) (tomograph\w*|spectroscop\w*|imaging)|near-?infrared spectroscopy system|NIR-?II (fluorescence )?(imaging|window|microscop\w*)|short-?wave infrared (fluorescence )?imaging|laser speckle (contrast )?imaging|speckle contrast'
  - 'endoscop\w* (imaging|microscop\w*|OCT|optical coherence|probes?)|(optical|fluorescence|OCT|confocal|photo-?acoustic|Raman|capsule|fib(er|re)|lensless|multimode) endoscop\w*|endomicroscop\w*|fib(er|re) (bundle|probe|endoscop\w*) imaging|multimode fib(er|re) (imaging|endoscop\w*)|lensless (fib\w*|endoscop\w*|imaging|microscop\w*)|capsule endoscop|GRIN (lens|endoscop\w*|microendoscop\w*)|miniscope|head-mounted (microscop\w*|imaging)|miniaturi[sz]ed (microscope|two-photon|imaging)'
  - 'adaptive optics (microscop\w*|imaging|ophthalm\w*|two-photon|scanning)|deep[- ]tissue (imaging|microscop\w*|nanoscop\w*)|(wavefront shaping|focusing) (in|through) (biological )?tissue|through (scattering|turbid) (tissue|media)'
  - 'calcium imaging|voltage imaging|neural activity imaging|functional (optical )?imaging|neurophotonic|hemodynamic (imaging|mapping)|intravital (imaging|microscop\w*)|in vivo (optical |fluorescence )?(imaging|microscop\w*)'
  - 'computational (imaging|microscop\w*)|lens-?free (on-chip )?microscop|ptychograph\w*|light[- ]field microscop|Fourier light-?field|snapshot (hyperspectral )?(imaging|microscop\w*)|single-pixel imaging'
  - 'virtual (staining|histolog\w*|H&E)|slide-free|optical biopsy|stain-free'
  - 'genetically encoded (indicators?|sensors?|reporters?)|\b(GECI|GEVI)s?\b|fluorescent (probes?|proteins?|indicators?|reporters?) for (imaging|microscop\w*|nanoscop\w*)'
  - 'biophotonic|biomedical optic|optical imaging|tissue optics|ophthalmic imaging|retinal imaging|scanning laser ophthalmoscop|\bAOSLO\b'
  - '(denois\w*|deconvol\w*|restoration|super-resolution reconstruction|segmentation)\W+(\w+\W+){0,4}(fluorescence|microscop\w*|light-sheet|two-photon|calcium imaging)'

# Broad imaging words that count in the TITLE only (an abstract that merely mentions a microscope does not count)
title_include:
  - 'microscop(y|e|es)\b|nanoscop\w*|bioimaging|diffraction tomograph\w*|photo-?acoustic|opto-?acoustic|fluorescence lifetime|(sensors?|biosensors?|probes?|indicators?|reporters?) for (live-cell |in vivo |intravital )?imaging|(?-i:\bd?STORM\b|\bPALM\b)|single[- ]molecule (localization|fluorescence|imaging|tracking)|single-particle tracking|super[- ]?resolution (mapping|analysis|reconstruction|imaging|microscop\w*)|nanoscale imaging|fluorescent proteins?|Raman (imaging|microscop\w*|histolog\w*|endoscop\w*|spectroscopy (of|for|in) (\w+ ){0,2}(cells?|tissues?|tumou?rs?|cancer|glioma|diagnos\w*|biops\w*|bone|skin|blood))|phase retrieval|\bimager\b|label-free (imaging|microscop\w*|histolog\w*|optical|virtual|identification of (cells|tumou?r)|classification of (cells|tumou?r))|hyperspectral (microscop\w*|endoscop\w*|imaging (of|in) (tissues?|tumou?rs?|cells?|skin|surgery|patients?))|(fluorescence|single-molecule|lifetime|Raman|optical|photoacoustic|spectral|3D|three-dimensional|volumetric|in vivo|intravital|whole-(body|organ)|deep-brain|cortical|neuronal|live-cell) imaging|imaging (pipeline|platform|system|toolbox|method|probe)|optical (sectioning|clearing|electrophysiology)|all-optical'

strong_include:
  - 'three-photon microscop'
  - 'two-photon (microscop\w*|imaging|excitation)'
  - 'light-sheet'
  - 'oblique plane microscop'
  - '\bSTED\b'
  - '\bRESOLFT\b'
  - '\bMINFLUX\b'
  - 'expansion microscop'
  - 'optical coherence tomograph'
  - 'photo-?acoustic (tomograph\w*|microscop\w*|imaging)'
  - 'stimulated Raman (scattering )?(microscop\w*|imaging|histolog\w*)'
  - 'coherent anti-?Stokes Raman (scattering )?(microscop\w*|imaging)'
  - 'quantitative phase (imaging|microscop\w*)'
  - 'optical diffraction tomograph'
  - 'fluorescence lifetime imaging'
  - 'miniscope'
  - 'calcium imaging'
  - 'light-field microscop'
  - 'Fourier ptychograph'
  - 'NIR-II (fluorescence )?imaging'
  - 'diffuse optical tomograph'
  - 'endomicroscop'
  - 'super-resolution (microscop\w*|imaging)'
  - 'structured illumination microscop'
  - 'photothermal (microscop\w*|imaging)'
  - 'voltage imaging'
  - 'adaptive optics'

title_only: []   # every include pattern is already specific; generic words never count on their own

characterisation_list: '(?:\b(?:XRD|XPS|SEM|TEM|EDS|AFM|FTIR|UV-?vis|DLS|TGA|NMR|confocal|fluorescence)\b(?:\s*(?:microscopy|spectroscopy|imaging|analysis))?\s*(?:,|/|;|\band\b)\s*){2,}(?:\band\s+)?\b(?:XRD|XPS|SEM|TEM|EDS|AFM|FTIR|UV-?vis|DLS|TGA|NMR|confocal|fluorescence)\b'

exclude_sources: ['zenodo', 'figshare', 'mendeley data', 'dryad', 'harvard dataverse', 'pangaea']

extra_topics:
  - name: Imaging probes and reporters
    title:
      - '(photoswitch\w*|photochromic|bright|near-infrared|NIR) (fluorescent )?(proteins?|probes?|reporters?|indicators?)\W+(\w+\W+){0,5}(imaging|microscop\w*|nanoscop\w*|tomograph\w*)'
    abstract:
      - 'genetically encoded (calcium|voltage) indicator'
    exclude: ['photothermal therapy', 'photodynamic therapy', 'chemodynamic', 'nanozyme', 'theranostic']

core_journals:
  issn: ['2156-7085', '1083-3668', '1560-2281', '2329-423X', '2329-4248', '2213-5979', '1864-063X', '1864-0648']
  titles: ['biomedical optics express', 'journal of biomedical optics', 'neurophotonics', 'photoacoustics', 'journal of biophotonics']

max_age_days: 180

exclude:
  - '(?s)^(?!.*(photo-?acoustic|opto-?acoustic|optical|fluoresc|microscop|\bOCT\b|Raman|photon|light)).*(ultrasound|ultrasonograph|\bMRI\b|magnetic resonance|computed tomography|\bCT\b|\bPET\b|\bSPECT\b|radiograph|mammograph|X-ray)'
  - '(?s)^(?!.*(fluoresc|optical|light|photon|Raman|confocal|correlative)).*(electron microscop\w*|\bSEM\b|\bTEM\b|cryo-?EM|cryo-?ET|atomic force microscop\w*|\bAFM\b|scanning tunneling)'
  - 'satellite|remote sensing|\bUAV\b|galax(y|ies)|telescope|astronom|exoplanet|land[- ]cover'
  - 'food (science|quality|safety)|meat|fruit|grain|tea leaves|adulterat|pesticide residue'
  - 'photovoltaic|solar cells?|perovskite (LED|solar)|light-emitting diodes?|lasing|photodetectors?'

technique:
  terms:
    - 'microscop|imaging|tomograph|endoscop|nanoscop|photo-?acoustic|optical coherence|Raman|fluorescen|light-sheet|miniscope|ophthalmoscop|histolog'
  cues:
    - '\b(we|here,? we|this work|this paper|this study)\s+(\w+\s+){0,3}(develop|demonstrat|present|introduc|report|propos|realiz|build|construct|design|invent|engineer)\w*\s+(\S+\s+){0,8}?(microscop\w*|imaging (system|platform|modality|method|technique|approach|framework|pipeline|workflow)|tomograph\w*|endoscop\w*|nanoscop\w*|probes?|reporters?|indicators?|sensors?|cameras?|instrument\w*|algorithm|network|framework|method|workflow|platform)'
  strong_cues:
    - '\b(we|here,? we|this work|this study)\s+(\w+\s+){0,2}(develop|demonstrat|present|introduc|report|propos|realiz|invent|engineer)\w*\s+(a|an|the first)\s+(\S+\s+){0,6}?(microscope|microscopy|imaging (system|platform|modality|method|technique|approach)|tomograph\w*|endoscope|nanoscop\w*|probe|reporter|indicator|camera|instrument|platform|framework|method|workflow)\b'
    - '\b(video-rate|volumetric|ultra-?deep|record (depth|speed)|\d+(\.\d+)?[- ]?mm depth|freely (moving|behaving)|whole-?brain|first-in-human|\d+ ?volumes? per second|\d+-fold (faster|deeper|larger))\b'
  # imaging / optics journals: here one abstract mention is enough. Elsewhere a paper needs the modality in its
  # title or a method claim (see abstract_needs_field_journal)
  journals: ['nature methods', 'nature photonics', 'light: science', '^optica\b', 'biomedical optics express', 'journal of biomedical optics', 'neurophotonics', 'photoacoustics', 'journal of biophotonics', 'apl photonics', 'advanced photonics', '^elight', 'laser & photonics', 'npj imaging', 'chemical & biomedical imaging', 'optics letters', 'optics express', 'acs photonics', '^view$', 'biophotonics discovery', 'cell reports methods', 'journal of microscopy', 'communications engineering', 'ieee transactions on medical imaging', 'medical image analysis', 'methods in microscopy', 'journal of optics', 'optics and lasers in engineering', 'ultrafast science']

# Routine clinical studies that use OCT/OCTA as a measuring tool (method papers are unaffected)
routine_application:
  domain:
    - 'metrics|biometric|measured (by|with)|reproducibility|repeatability|agreement|patients?|eyes\b|cohort|retrospective|prospective|case (series|report|description)|follow-?up|outcomes?|prevalence|risk factors?|association (between|of|with)|children|adults|cross-sectional|clinical (study|trial)'
    - 'classification|segmentation|diagnosis of|grading'
  method:
    - 'optical coherence tomography( angiography)?|\bOCTA?\b|fundus|retinal (thickness|nerve fib\w*|layers?)|choroidal (thickness|vascular)|macular|foveal avascular'

# Abstract-only matches count only in the journals listed under technique.journals; a biology or clinical
# paper elsewhere must name the imaging method in its title or claim a new method / probe / instrument.
abstract_needs_field_journal: true

exclude_title:
  - '^comment on\b|^reply to\b|^erratum|^correction|call for papers|editorial board|issue information'
  - 'photothermal therapy|photodynamic therapy|chemodynamic|nanozyme|synergistic (therapy|PTT|PDT|CDT)'
  - '(?i)mass spectrometry imaging|MALDI|\bX-ray\b|neutron|electron (microscop\w*|tomograph\w*|bremsstrahlung)|cathodolumines\w*|\bSEM\b|synthetic aperture radar|\bSAR\b|magnetic particle imaging|seismic|image fusion|infrared and (low-light )?visible|^(?!.*photo-?acoustic).*ultrasound localization microscopy|positron|free-electron|\bMRI\b'
  - 'case report|case series|a case of|masquerad|mimicking|following (uneventful )?(cataract|surgery)|quality indicators|health services|microwave imaging|magnetic resonance|perfusion imaging|positron emission|radiolog\w*|imaging findings|molecular dynamics|lidar|atomic force|probe microscopy|calorimetry|all-optical (logic|unitary|Toffoli|switch)|solid-state laser|electrowetting|photonic crystal waveguide|imaging-derived phenotypes|ultrasound biomicroscop\w*|Ziehl|smear|microwave|impedance microscop\w*|urine|X[-–]ray|thermometry|arc heater|reaction intermediates|environmental waters?|quality assessment'
  - 'endoscopic (submucosal|dissection|surgery|decompression|treatment|therapy|findings|resection|ultrasound|retrograde|sinus|repair|variceal|cyanoacrylate)|full-endoscopic|biportal|laparoscop\w*|arthroplasty|denervation'

soft_exclude:
  patterns:
    - 'theranostic|imaging-guided|nanoplatforms?|nanomedicine|tumou?r therapy|antitumou?r|drug delivery|nanocarriers?'
  unless_title: ['microscop', 'tomograph', 'imaging system', 'camera', 'instrument', 'optical coherence', 'light-sheet', 'endoscop', 'nanoscop', 'super-resolution']

